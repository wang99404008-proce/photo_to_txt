name: Build Windows Offline OCR EXE

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝依賴庫
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyqt6 paddlepaddle paddleocr

    - name: 使用 PyInstaller 打包成單一 EXE
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "OfflineOCR" main.py

    - name: 壓縮為 ZIP 檔
      run: |
        powershell Compress-Archive -Path dist/OfflineOCR/* -DestinationPath OfflineOCR-Windows.zip

    - name: 發布 Release 並附帶 EXE ZIP 檔
      uses: softprops/action-gh-release@v1
      with:
        files: OfflineOCR-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
