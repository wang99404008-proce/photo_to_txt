name: Build Offline OCR Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 支援在 GitHub 網頁上按鈕手動觸發打包

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 1. 拉取 GitHub 程式碼
      uses: actions/checkout@v3

    - name: 2. 設定 Python 3.10 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 3. 安裝 Python 依賴套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. 使用 PyInstaller 進行雲端打包
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "OfflineOCR" main.py

    - name: 5. 壓縮打包結果為 ZIP 檔
      run: |
        powershell Compress-Archive -Path dist/OfflineOCR/* -DestinationPath OfflineOCR-Windows.zip

    - name: 6. 自動上傳並建立 GitHub Release 發布頁面
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: OfflineOCR-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 7. 上傳 Artifact (手動觸發時可直接在 Actions 頁面下載)
      uses: actions/upload-artifact@v3
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      with:
        name: OfflineOCR-Windows
        path: OfflineOCR-Windows.zip
